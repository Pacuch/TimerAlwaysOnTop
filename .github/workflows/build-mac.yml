name: Build macOS App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch: # Allows you to run this manually from the Actions tab

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build macOS app with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --windowed --name Timer main.py
        
    - name: Zip the .app (Required to preserve Mac file structure)
      run: |
        cd dist
        zip -r RadiologistTimer-macOS.zip Timer.app
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RadiologistTimer-macOS
        path: dist/RadiologistTimer-macOS.zip

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest macOS Build' }}
        body: |
          Automatyczny build aplikacji dla systemu macOS.
          Pobierz `RadiologistTimer-macOS.zip`, rozpakuj i uruchom `Timer.app`.
        draft: false
        prerelease: false
        make_latest: "true"
        files: dist/RadiologistTimer-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

